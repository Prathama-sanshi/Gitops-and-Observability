apiVersion: v1
kind: Service
metadata:
  name: {{ include "file-monitor-charts.fullname" . }}
  labels:
    {{- include "file-monitor-charts.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.portName | default "http" }}
      protocol: TCP
      name: {{ .Values.service.portName | default "http" }}
  selector:
    {{- include "file-monitor-charts.selectorLabels" . | nindent 4 }}
