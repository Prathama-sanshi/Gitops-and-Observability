apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elasticsearch-kibana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app: ek-stack
spec:
  project: dev               
  destination:
    server: https://kubernetes.default.svc
    namespace: logging           
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true    
      - ServerSideApply=true
  source:
    repoURL: git@github.com:Prathama-sanshi/Gitops-and-Observability.git
    targetRevision: argocd-obs 
    path: Application/helm-charts/ElasticSearch-Kibana/
