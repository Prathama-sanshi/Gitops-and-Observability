apiVersion: monitoring.coreos.com/v1
kind: AlertmanagerConfig
metadata:
  name: email-notifications
  namespace: default
  labels:
    release: prometheus
spec:
  route:
    receiver: 'email-notifications'
    group_by: ['alertname', 'severity']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1h
  receivers:
  - name: 'email-notifications'
    email_configs:
    - to: 'psanshi@gmail.com'
      from: 'prathamsanshi@gmail.com'
      smarthost: 'smtp.gmail.com:587'
      auth_username:
        name: email-credentials
        key: username
      auth_password:
        name: email-credentials
        key: password
      require_tls: true