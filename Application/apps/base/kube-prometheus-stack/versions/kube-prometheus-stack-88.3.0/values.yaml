apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  releaseName: kube-prometheus-stack
  targetNamespace: observability
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./Application/helm-charts/kube-prometheus-stack
      sourceRef:
        kind: GitRepository
        name: fluxcd-obs
        namespace: flux-system