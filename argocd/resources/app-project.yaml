apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev 
  namespace: argocd
spec:
  description: "Project for dev, argocd, and observability workloads"
  
  # 1. Allow deployments only to these specific destination namespaces
  destinations:
    - name: in-cluster
      server: https://kubernetes.default.svc
      namespace: dev
    - name: in-cluster
      server: https://kubernetes.default.svc
      namespace: argocd
    - name: in-cluster
      server: https://kubernetes.default.svc 
      namespace: observability
    - name: in-cluster
      server: https://kubernetes.default.svc  # Fixed: Added missing //
      namespace: kube-system

  # 2. Combined and structured Cluster-Scoped resource permissions
  clusterResourceWhitelist:
    - group: ""  # Empty string allows the core/default Kubernetes group (Namespaces, Nodes, etc.)
      kind: Namespace
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding

  # 3. Allow all standard namespace-scoped resources (Deployments, Services, etc.)
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # 4. Allowed source repositories
  sourceRepos:
    - 'git@github.com:Prathama-sanshi/Argocd-and-Observability.git'
